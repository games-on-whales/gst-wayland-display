name: build & test

on:
  push:
  pull_request:

jobs:
  # CPU phases on a GitHub-hosted runner: lint, build (default + the cuda build
  # is skipped without an Nvidia GPU), and the non-ignored tests. The GPU phases
  # (gpu / integration / bench) self-skip when there is no render node.
  harness:
    name: harness (lint · build · unit)
    runs-on: ubuntu-latest
    container:
      # Independent distro base: a fresh fork can run CPU checks before it has
      # published its own patched Vulkan image. Patched encoder tests run separately.
      image: archlinux:base
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git curl openssl icu \
            gstreamer gst-plugins-base-libs gst-plugins-bad-libs \
            wayland libinput libxkbcommon mesa libdrm systemd-libs \
            clang pkgconf vulkan-headers vulkan-icd-loader

      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal \
                --default-toolchain "${RUST_VERSION:-1.94.0}" --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Harness
        run: bash ci/harness.sh lint build unit

      - name: Type-check the raw CUDA producer path without a GPU
        run: cargo check --workspace --features cuda

  # Full matrix (gpu / integration / bench) on real hardware. Off by default;
  # enable by registering a self-hosted runner labelled `gpu` and setting the
  # repository variable GPU_RUNNER=true. Require a render node and at least
  # one compatible encoder integration; tests for other vendors may skip.
  harness-gpu:
    name: harness (full · GPU)
    if: ${{ vars.GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, gpu]
    env:
      GST_WAYLAND_DISPLAY_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Harness (all phases)
        run: bash ci/harness.sh
