name: build & test

on:
  push:
  pull_request:

jobs:
  # CPU phases on a GitHub-hosted runner: lint, build (default + the cuda build
  # is skipped without an Nvidia GPU), and the non-ignored tests. The GPU phases
  # (gpu / integration / bench) self-skip when there is no render node.
  harness:
    name: harness (lint · build · unit)
    runs-on: ubuntu-latest
    container:
      # The project's own image: patched GStreamer 1.28 at /opt/gst (gstreamer-rs
      # 0.25 needs >= 1.28; the old gstreamer:1.26.7 base is too old) plus all the
      # build deps. PKG_CONFIG_PATH/LD_LIBRARY_PATH are baked into the image ENV.
      image: ghcr.io/games-on-whales/gst-wayland-display:vulkan
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        # Image already carries the gst-1.28 + link deps; only ensure the extras
        # the harness's non-GPU phases need are present (idempotent on Fedora).
        run: |
          dnf install -y \
            git openssl-devel libicu \
            wayland-devel libinput-devel libxkbcommon-devel mesa-libgbm-devel \
            mesa-libEGL-devel mesa-libGLES-devel systemd-devel clang clang-devel

      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal \
                --default-toolchain "${RUST_VERSION:-1.94.0}" --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Harness
        run: bash ci/harness.sh lint build unit

  # Full matrix (gpu / integration / bench) on real hardware. Off by default;
  # enable by registering a self-hosted runner labelled `gpu` and setting the
  # repository variable GPU_RUNNER=true.
  harness-gpu:
    name: harness (full · GPU)
    if: ${{ vars.GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Harness (all phases)
        run: bash ci/harness.sh
