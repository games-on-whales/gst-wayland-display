name: shader sources
on:
  push:
    paths: ['wayland-display-core/src/utils/shaders/**', 'ci/shaders.sh', '.github/workflows/shaders.yml']
  pull_request:
    paths: ['wayland-display-core/src/utils/shaders/**', 'ci/shaders.sh', '.github/workflows/shaders.yml']
jobs:
  shaders:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y glslc
      - uses: actions/checkout@v4
      - run: bash ci/shaders.sh
