name: shader sources
on:
  push:
    paths: ['wayland-display-core/src/utils/shaders/**', 'ci/shaders.sh', '.github/workflows/shaders.yml']
  pull_request:
    paths: ['wayland-display-core/src/utils/shaders/**', 'ci/shaders.sh', '.github/workflows/shaders.yml']
jobs:
  shaders:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      # diffutils (cmp) is not in the archlinux:base image; Arch's glslc matches
      # the environment the committed .spv files are regenerated with.
      - run: pacman -Syu --noconfirm git shaderc diffutils
      - uses: actions/checkout@v4
      - run: bash ci/shaders.sh
