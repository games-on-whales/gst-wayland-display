[package]
name = "wayland-display-core"
authors = ["Victoria Brekenfeld <git@drakulix.de>", "Alessandro Beltramo <github.com/ABeltramo>"]
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Wayland Compositor producing GStreamer buffers"
rust-version = "1.88"

[lib]
name = "waylanddisplaycore"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[features]
default = []
cuda = []

[dependencies]
gst.workspace = true
gst-video.workspace = true
tracing.workspace = true
once_cell.workspace = true
wayland-backend = "0.3.15"
wayland-server = { version = "0.31.13", features = ["libwayland_1_23"] }
wayland-scanner = "0.31.10"
gstreamer-allocators = { version = "0.25", package = "gstreamer-allocators", features = ["v1_24", "v1_16"] }
# Safe bindings to libgstvulkan-1.0 for the shared-device (interpipe) encode path:
# GstVulkanInstance/Device shared via GstContext, a GstVulkanImageBufferPool of
# encode-src NV12 images, and recovering the VkImage to run our compute shader on the
# encoder's device. v1_28 for the encode buffer-pool API.
gstreamer-vulkan = { version = "0.25", package = "gstreamer-vulkan", features = ["v1_28"] }
# Raw FFI to libgstvulkan-1.0: the vk-typed calls (config_set_allocation_params,
# select_queue, get_physical_device, gst_is_vulkan_image_memory) are unbound in the safe
# crate (gir skips Vulkan types), and we read VkDevice/VkImage from the public structs.
gstreamer-vulkan-sys = { version = "0.25", package = "gstreamer-vulkan-sys" }
libloading = "0.8.9"
# Vulkan, for the cross-vendor RGBA->NV12 converter (imports the compositor's RGBA
# dmabuf, runs a compute shader, exports a LINEAR NV12 dmabuf the encoders import
# zero-copy). Loaded dynamically so a missing loader is a runtime, not link, error.
ash = { version = "0.38", default-features = false, features = ["loaded"] }
# For attaching a sync_file to the exported dmabuf (DMA_BUF_IOCTL_IMPORT_SYNC_FILE),
# so implicit-sync consumers (VA encoders) track our Vulkan write.
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"
cc = "1"

[dev-dependencies]
tracing-subscriber = "0.3.18"
wayland-client = "0.31.10"
wayland-protocols = { version = "0.32.8", features = ["client"] }
calloop = { version = "0.14.2", features = ["executor", "futures-io", "signals"] }
tempfile = "3.20.0"
test-log = { version = "0.2.18", features = ["trace"] }

[dependencies.smithay]
git = "https://github.com/games-on-whales/smithay"
rev = "a166cf4c94b5aedc332a65aa1dd753e8148829c3"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "renderer_gl",
    "use_system_lib",
    "desktop",
    "wayland_frontend"
]
